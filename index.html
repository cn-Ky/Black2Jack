<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Black2Jack</title>
</head>
<body>

  <svg class="wood" aria-hidden="true">
    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".055 .0018"
        numOctaves="2"
        seed="17"
      />
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain)"/>
  </svg>

  <div class="wrap">
    <main class="machine ready" id="machine">
      <section class="felt" aria-label="Blackjack table">
        <svg class="felt-texture" aria-hidden="true">
          <filter
            id="fibers"
            x="0"
            y="0"
            width="100%"
            height="100%"
            color-interpolation-filters="sRGB"
          >
            <feTurbulence
              type="fractalNoise"
              baseFrequency=".72 .26"
              numOctaves="3"
              seed="28"
              stitchTiles="stitch"
            />
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
              <feFuncR type="linear" slope="1.65" intercept="-.28"/>
              <feFuncG type="linear" slope="1.65" intercept="-.28"/>
              <feFuncB type="linear" slope="1.65" intercept="-.28"/>
            </feComponentTransfer>
          </filter>
          <rect width="100%" height="100%" filter="url(#fibers)"/>
        </svg>

        <div class="dealer-row">
          <div class="score">
            <span>DEALER</span>
            <b id="ds">—</b>
            <span class="hand-state" id="dealer-state"></span>
          </div>
          <div class="hand" id="dh"></div>
        </div>

        <div class="center">
          <div class="suits" aria-hidden="true">
            <span>♠</span>
            <span>♥</span>
            <span>♣</span>
            <span>♦</span>
          </div>
        </div>

        <div class="players" id="players"></div>

        <div
          class="result"
          id="result"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </section>

      <section class="console" aria-label="Game controls">
        <div class="tray" id="tray">
          <button class="slot" type="button">
            <span class="chip-face" aria-hidden="true">
              <b>10</b>
            </span>
            <span class="action-face" aria-hidden="true">HIT</span>
          </button>

          <button class="slot red" type="button">
            <span class="chip-face" aria-hidden="true">
              <b>25</b>
            </span>
            <span class="action-face" aria-hidden="true">STAND</span>
          </button>

          <button class="deal" id="deal" type="button">
            <span>DEAL</span>
          </button>

          <button class="slot blue" type="button">
            <span class="chip-face" aria-hidden="true">
              <b>50</b>
            </span>
            <span class="action-face" aria-hidden="true">DOUBLE</span>
          </button>

          <button class="slot black" type="button">
            <span class="chip-face" aria-hidden="true">
              <b>100</b>
            </span>
            <span class="action-face" aria-hidden="true">SPLIT</span>
          </button>
        </div>

        <div class="meters">
          <div class="meter" id="bm">
            <span class="label">
              <svg
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                aria-hidden="true"
              >
                <rect x="2" y="4" width="12" height="9" rx="2"/>
                <path d="M3 4V3l8-1v2M14 7h-4v3h4"/>
              </svg>
              BALANCE
            </span>

            <output
              class="money"
              id="bank"
              title="Available balance after your selected bet"
            >$950</output>
          </div>

          <button
            class="sound"
            id="sound"
            type="button"
            aria-label="Sound effects"
            aria-pressed="false"
            title="Turn sound on"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.65"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 5L5 9H2v6h3l5 4Z"/>
              <g class="waves">
                <path d="M14 8a6 6 0 0 1 0 8M17 5a10 10 0 0 1 0 14"/>
              </g>
              <path class="mute-mark" d="M15 9l6 6m0-6-6 6"/>
            </svg>
          </button>

          <div class="meter wager" id="wm">
            <span class="label">
  <svg
    viewBox="0 0 16 16"
    fill="none"
    stroke="currentColor"
    stroke-width="1.2"
    aria-hidden="true"
  >
    <circle cx="8" cy="8" r="6"/>
    <circle cx="8" cy="8" r="3.5"/>
    <path d="M8 2v2.5M8 11.5V14M2 8h2.5M11.5 8H14M3.76 3.76l1.77 1.77M10.47 10.47l1.77 1.77M3.76 12.24l1.77-1.77M10.47 5.53l1.77-1.77"/>
  </svg>
  <span id="bet-label">BET</span>
</span>

            <div class="amount">
              <button
                class="adjust"
                id="minus"
                type="button"
                aria-label="Reduce bet by 10 dollars"
                title="Bet −$10"
              >
                <svg
                  viewBox="0 0 12 12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M2 6h8"/>
                </svg>
              </button>

              <output class="money" id="bet">$50</output>

              <button
                class="adjust"
                id="plus"
                type="button"
                aria-label="Increase bet by 10 dollars"
                title="Bet +$10"
              >
                <svg
                  viewBox="0 0 12 12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M2 6h8M6 2v8"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <p
          class="sr-only"
          id="status"
          role="status"
          aria-live="polite"
        >Add chips and deal.</p>
      </section>
    </main>
  </div>
    <script src="js/script.js"></script>
</body>
</html>
